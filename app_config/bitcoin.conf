# fully-validating mainnet node (no pruning)
server=1
listen=1
txindex=0
prune=0

# RPC via cookie auth; reachable only over the internal overlay/bridge
rpcbind=0.0.0.0
rpcallowip=10.0.0.0/8
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16

# uncomment/tune for faster IBD if you have the RAM
#dbcache=4096
